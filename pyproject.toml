[project]
name = "scene-otsu"
version = "0.1.5.2"
description = "SRT subtitle scene splitter using Otsu method with VoyageAI embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Yuki Harada", email = "yukiharada1228@gmail.com"},
    {name = "William Marshall", email = "62070150+marshallwp@users.noreply.github.com"}
]
keywords = ["srt", "subtitle", "scene-split", "otsu", "voyageai", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "numpy>=2.3.5",
    "voyageai>=0.3.7",
    "scikit-learn>=1.7.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "black>=25.11.0",
    "isort>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/marshallwp/scene-otsu"
Documentation = "https://github.com/marshallwp/scene-otsu#readme"
Repository = "https://github.com/marshallwp/scene-otsu"
Issues = "https://github.com/marshallwp/scene-otsu/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_otsu"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
